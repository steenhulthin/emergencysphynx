<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Emergency Sphynx!</title>
<link rel="stylesheet" href="kittens.css">

<div id="putakitteninme" class="centered">
    <noscript>There would normally be a kitten here, but you disabled JavaScript and killed it.</noscript>
</div>

<a href="https://github.com/steenhulthin/emergencysphynx"><img style="position: absolute; top: 0; right: 0; border: 0;" src="https://s3.amazonaws.com/github/ribbons/forkme_right_darkblue_121621.png" alt="Fork me on GitHub"></a>

<script src="kittens.js"></script>
<script>
(function (win, doc) {
    var kitten = kittens[Math.floor(Math.random() * kittens.length)];
    var image  = doc.createElement('img');
    var link   = doc.createElement('a');

    link.className = 'kitten';
    link.href      = kitten.url;

    image.alt       = kitten.imageAlt;
    image.className = 'kitten-image';
    image.src       = kitten.imageUrl;

    link.appendChild(image);
    doc.getElementById('putakitteninme').appendChild(link);
}(this, document));
</script>
